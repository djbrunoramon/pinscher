name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    name: package and release
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      # Only a boolean reaches the job; the secrets themselves are scoped to the steps below.
      HAS_SIGNING_CERT: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install

      # Build without any secret in the environment: dependency build scripts run here.
      - name: Build app bundle
        run: ./scripts/bundle.sh

      - name: Import Developer ID certificate
        if: env.HAS_SIGNING_CERT == 'true'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/pinscher-certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/pinscher-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 20)"
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -f pkcs12 -k "$KEYCHAIN_PATH" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          rm -f "$CERT_PATH"

      - name: Sign, notarize and package
        env:
          PINSCHER_SKIP_BUILD: '1'
          PINSCHER_SIGN_IDENTITY: ${{ env.HAS_SIGNING_CERT == 'true' && secrets.PINSCHER_SIGN_IDENTITY || '-' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: ./scripts/package.sh

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.dmg dist/SHA256SUMS --verify-tag --generate-notes

      - name: Remove temporary keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/pinscher-signing.keychain-db" 2>/dev/null || true
